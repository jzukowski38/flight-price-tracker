name: Supabase keepalive

# Free Supabase projects pause after about a week of low activity, and the
# twice-weekly scan alone wasn't enough to prevent that. This reads one row
# from the price history every day so the project stays awake.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"     # daily, 15:17 UTC (about 9-10 AM Central)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Supabase secrets not set; nothing to keep awake."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/fare_observations?select=scanned_at&order=scanned_at.desc&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -o latest.json
          echo "Latest scan in history: $(cat latest.json)"
