name: Weekend fare scan

on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
    inputs:
      weekends:
        description: "Weekends to scan"
        default: "12"
  schedule:
    - cron: "37 13 * * 1"     # Mondays 13:37 UTC = 7:37 AM Central (CST)

concurrency:
  group: fare-scan       # never run two scans at once (they'd both alert)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository secrets (Settings → Secrets and variables → Actions).
      # Missing secrets just switch the matching feature off.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Scan
        shell: bash   # adds pipefail, so a failed scan fails the job despite `tee`
        run: |
          fare-finder scan --weekends "${{ github.event.inputs.weekends || '12' }}" \
            --csv output/fares.csv --json output/fares.json | tee output.txt
          {
            echo '```'
            cat output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fares-${{ github.run_number }}
          path: output/
          retention-days: 90
