[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fare-finder"
version = "0.1.0"
description = "Find the cheapest weekends to fly American Airlines nonstop from DFW."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fast-flights>=3.1,<4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fare-finder = "fare_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
